function shell(n,title,description,inner){return `<section class="card" id="section"><h2><span class="num">${n}</span>${title}</h2><p class="hint">${description}</p>${inner}<div class="buttons"><button class="btn light" ${active===0?'disabled':''} onclick="go(${active-1})">← Previous</button><button class="btn" ${active===8?'disabled':''} onclick="go(${active+1})">Next activity →</button></div></section>`}
function textarea(id,placeholder='Write your notes here…'){return `<textarea class="input" placeholder="${placeholder}" oninput="saveText('${id}',this.value)">${esc(state[id]||'')}</textarea>`}function saveText(id,val){state[id]=val;store()}function sayBtn(s){return `<button class="btn light" onclick='speak(${JSON.stringify(s)})'>🔊 Listen</button>`}
function radio(id,items){return `<div class="opt">${items.map((x,i)=>`<label><input type="radio" name="${id}" value="${i}" ${state[id]===String(i)?'checked':''} onchange="saveText('${id}',this.value)"> ${esc(x)}</label>`).join('')}</div>`}

if(active===4)parts=[`<img src="${img.penny}" alt="Penny, the speaker from the textbook" style="height:160px;border-radius:15px;float:right;margin:5px 0 12px 14px">`,`<p>In pairs, order phrases a–h from Penny's story. Watch or listen to the second part and check.</p>`,video(1),`<div class="hint">Choose a position from 1–8 for each phrase. Each position must be used once.</div><div class="gridorder">`,...penny5.map(([letter,s],i)=>`<div class="ord"><select aria-label="Position of ${letter}" onchange="saveText('e5_${i}',this.value)"><option value="">Order</option>${Array.from({length:8},(_,k)=>`<option value="${k+1}" ${state['e5_'+i]===String(k+1)?'selected':''}>${k+1}</option>`).join('')}</select><span><b>${letter}.</b> ${esc(s)}</span></div>`),`</div><div class="buttons"><button class="btn" onclick="checkConfigured('e5',8)">Check Answers</button><button class="btn light" onclick="showConfigured('e5',8)">Show Answer Key</button><button class="btn orange" onclick="resetGroup('e5',8)">Try Again</button></div><div id="e5summary"></div>`,`<div class="rule">The official story order is built in. Press Check Answers to check all eight positions.</div>`,`<div class="block"><b>5B. How are Taylor and Penny’s stories similar?</b>${textarea('similar','Both stories are about…')}</div>`];
if(active===5)parts=[`<div class="rule"><b>Skill · Showing interest</b><p>Good listeners show they are interested in what someone else is saying.</p>Use short response expressions such as “Oh no!”, “Really?” or “That’s amazing!”; ask what happened next; use an appropriate intonation.</div><p><b>Listen and repeat</b> the phrases when you hear the beeps. How do Taylor and Penny show they are interested in each other's stories?</p>`,video(1),`<div class="buttons">${sayBtn('Really? Oh no! What happened next? You’re kidding! That’s amazing!')}</div><div class="block"><b>Write two ways Taylor or Penny showed interest.</b>${textarea('interest')}</div>`];

if(active===8)parts=[`<p>Choose one idea. Make notes about what happened and how you felt. Then tell your partner your story.</p><img class="photo" src="${img.topics}" alt="First day of school; birthday celebration; losing something important; a difficult day">`,`<div class="block"><b>9A · Choose your story</b>${radio('topic',['Your first day at work or school','A birthday or celebration','A time when you lost something important','A difficult day'])}</div><div class="two"><div class="block"><b>What happened?</b>${textarea('s1')}</div><div class="block"><b>When and where?</b>${textarea('s2')}</div><div class="block"><b>Who was there?</b>${textarea('s3')}</div><div class="block"><b>How did you feel?</b>${textarea('s4')}</div></div><div class="cue"><b>9B · PRACTICE: Pair storytelling</b><p>Take turns telling your stories. Listen to your partner and show interest by responding to what they say or by asking questions.</p><div class="two"><div class="panel"><b>Storyteller</b><p>Let me tell you about…</p><p>At first, I felt…</p><p>Then something unexpected happened…</p><p>You’ll never guess what happened next!</p><p>In the end…</p></div><div class="panel"><b>Active listener</b><p>Really? What happened?</p><p>That’s amazing! / Oh no!</p><p>What did you do then?</p><p>You’re kidding! / You poor thing!</p><p>How did you feel?</p></div></div><label><b>Partner feedback: one thing they did well</b></label>${textarea('partnerfeedback','Your partner used interesting expressions / asked follow-up questions…')}</div><div class="cue"><b>9C · PERSONAL BEST</b><p>Find another partner and tell your story again. How is your storytelling better this time?</p>${textarea('personalbest','This time I spoke more clearly / used time expressions / showed more feelings…')}</div><div class="block"><b>Partner's name</b><input class="input" value="${esc(state.partner||'')}" oninput="saveText('partner',this.value)" placeholder="Name"><b>What happened in your partner's story?</b>${textarea('partnerstory')}</div><div class="buttons"><button class="btn" onclick="window.print()">Print story notes</button><button class="btn green" onclick="alert('Your responses are saved on this device.')">Save ✓</button></div>`];

function teacherEditor(id,n,choices){if(!teacher)return `<div class="hint">Teacher: Turn on Teacher Mode to enter the verified listening answer key. Unverified answers will not be graded.</div>`;return `<div class="teacher"><b>Teacher answer key (saved locally)</b><p class="hint">Enter the verified answers from your teacher’s book. Do not guess from the video.</p><div class="gridorder">${Array.from({length:n},(_,i)=>`<label>Question ${i+1}<select class="input" onchange="saveText('key_${id}_${i}',this.value)"><option value="">Not set</option>${choices.map((v,j)=>`<option value="${j}" ${state['key_'+id+'_'+i]===String(j)?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div></div>`}
function checkConfigured(id,n){const keys=Array.from({length:n},(_,i)=>state['key_'+id+'_'+i]);if(keys.some(x=>x===undefined||x==='')){feedback(id+'summary','The verified answer key has not been entered yet. Please ask your lecturer to open Teacher Mode and enter it before checking.',false);return}let count=0;for(let i=0;i<n;i++){let correct=id==='e5'?String(Number(keys[i])+1):keys[i];let good=state[id+'_'+i]===correct;count+=good?1:0;let letter=id==='e2'?['True','False'][Number(keys[i])]:id==='e3'?'abcdef'[Number(keys[i])]:id==='e8'?['Speaker A','Speaker B'][Number(keys[i])]:Number(keys[i])+1;let holder=el(id+'f'+i);if(holder)holder.innerHTML=`<div class="feedback ${good?'ok':'bad'}">${good?'✓ Correct':'✗ Check again'} · Answer: <b>${letter}</b></div>`}feedback(id+'summary',`Score: <b>${count}/${n}</b>. Correct answers are shown above.`,true)}
function showConfigured(id,n){const keys=Array.from({length:n},(_,i)=>state['key_'+id+'_'+i]);if(keys.some(x=>x===undefined||x==='')){feedback(id+'summary','Answer key not supplied yet; your teacher can configure it in Teacher Mode.',false);return}const label=i=>id==='e2'?['True','False'][Number(keys[i])]:id==='e3'?'abcdef'[Number(keys[i])]:id==='e8'?['A','B'][Number(keys[i])]:Number(keys[i])+1;feedback(id+'summary',`Answer key: ${keys.map((_,i)=>`${i+1}. <b>${label(i)}</b>`).join(' · ')}`)}
function resetGroup(id,n){for(let i=0;i<n;i++)delete state[id+'_'+i];store();load()}
let pick=null;function render7(){const assigned=state.sort7||{};el('chips').innerHTML=phrases7.map((p,i)=>assigned[i]===undefined?`<button type="button" draggable="true" ondragstart="pick=${i}" onclick="pick=${i};render7()" class="chip ${pick===i?'selected':''}">${esc(p)}</button>`:'').join('')||'<span class="hint">All phrases have been placed.</span>';el('sorting').innerHTML=phraseCategories.map((category,j)=>`<div class="sortbox" ondragover="event.preventDefault()" ondrop="event.preventDefault();place7(${j})" onclick="place7(${j})"><h4>${category}</h4>${phrases7.map((p,i)=>assigned[i]===j?`<button class="chip" onclick="event.stopPropagation();remove7(${i})">${esc(p)} ×</button>`:'').join('')}</div>`).join('')};function place7(j){if(pick===null)return;state.sort7=state.sort7||{};state.sort7[pick]=j;pick=null;store();render7()};function remove7(i){delete state.sort7[i];store();render7()};function reset7(){delete state.sort7;store();load()};function check7(){let a=state.sort7||{},c=0;const rows=phrases7.map((p,i)=>{const good=a[i]===key7[i];if(good)c++;return `<div class="small">${good?'✓':'✗'} ${esc(p)} → <b>${phraseCategories[key7[i]]}</b></div>`});feedback('feed7',`Score: ${c}/10<hr>${rows.join('')}`)}function reveal7(){feedback('feed7',phrases7.map((p,i)=>`<div class="small">${esc(p)} → <b>${phraseCategories[key7[i]]}</b></div>`).join(''))}
